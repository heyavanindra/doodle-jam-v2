<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#1BE678"/>
      <stop offset="100%" stop-color="#0EC964"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFC700"/>
      <stop offset="100%" stop-color="#FFA400"/>
    </linearGradient>
  </defs>

  <!-- Main Icon Group -->
  <g stroke="#141414" stroke-linecap="round" stroke-linejoin="round">
    <!-- Green Left Wing (Upper + Lower Lobes) -->
    <path d="M 244 214
             C 214 172, 184 134, 156 142
             C 128 150, 134 188, 164 212
             C 176 222, 180 226, 164 228
             C 112 234, 72 252, 78 286
             C 84 320, 138 316, 200 290
             Z"
          fill="url(#greenGrad)" stroke-width="24"/>

    <!-- Yellow Right Horizontal Arm (Behind Diagonal Slash) -->
    <path d="M 248 242
             C 306 238, 370 250, 376 284
             C 382 318, 330 326, 272 302
             L 228 282 Z"
          fill="url(#yellowGrad)" stroke-width="24"/>

    <!-- Yellow Diagonal Slash (Foreground) -->
    <path d="M 326 142
             C 344 152, 344 182, 320 218
             L 232 350
             C 210 382, 180 386, 164 372
             C 148 358, 156 328, 180 294
             L 268 166
             C 290 134, 308 132, 326 142 Z"
          fill="url(#yellowGrad)" stroke-width="24"/>
  </g>

  <!-- Three Spark / Motion Rays (Top Right) -->
  <g stroke="#141414" stroke-width="20" stroke-linecap="round">
    <line x1="382" y1="146" x2="396" y2="104"/>
    <line x1="406" y1="184" x2="446" y2="156"/>
    <line x1="414" y1="222" x2="448" y2="228"/>
  </g>
</svg>