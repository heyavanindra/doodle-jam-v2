<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1342 1342" width="1342" height="1342" role="img" aria-label="Logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#25272c"/>
      <stop offset="0.6" stop-color="#141518"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </radialGradient>

    <!-- silver faces of the pillar -->
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9dce1"/>
      <stop offset="1" stop-color="#9ca1aa"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d7dc"/>
      <stop offset="0.5" stop-color="#a9aeb6"/>
      <stop offset="1" stop-color="#6c727b"/>
    </linearGradient>

    <!-- champagne-gold ring -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="560" y1="250" x2="960" y2="1100">
      <stop offset="0" stop-color="#fff3d1"/>
      <stop offset="0.35" stop-color="#e3c27a"/>
      <stop offset="0.7" stop-color="#b98d3c"/>
      <stop offset="1" stop-color="#e9cf93"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <!-- engraved grooves at the base of the pillar + center facet line -->
    <mask id="cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="1342" height="1342">
      <rect width="1342" height="1342" fill="#fff"/>
      <rect x="300" y="932" width="220" height="10" fill="#000"/>
      <rect x="300" y="966" width="220" height="10" fill="#000"/>
      <rect x="300" y="1000" width="220" height="10" fill="#000"/>
      <rect x="402" y="236" width="4" height="880" fill="#000"/>
    </mask>
  </defs>

  <!-- tile -->
  <rect width="1342" height="1342" rx="300" fill="url(#bg)"/>
  <rect x="3" y="3" width="1336" height="1336" rx="297" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>

  <g transform="translate(-5 0)">
    <!-- soft gold glow behind the ring -->
    <path d="M560 297 C790 297 955 440 955 640 C955 870 790 1048 560 1048"
          fill="none" stroke="#d9b362" stroke-opacity="0.35" stroke-width="104" stroke-linecap="round" filter="url(#glow)"/>

    <!-- ring -->
    <path d="M560 297 C790 297 955 440 955 640 C955 870 790 1048 560 1048"
          fill="none" stroke="url(#gold)" stroke-width="104" stroke-linecap="round"/>
    <!-- ring top highlight -->
    <path d="M565 262 C795 262 925 395 940 520"
          fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>

    <!-- pillar -->
    <g mask="url(#cuts)">
      <path d="M404 238 L333 430 V1075 Q333 1100 358 1100 H404 Z" fill="url(#faceL)"/>
      <path d="M404 238 L475 430 V1075 Q475 1100 450 1100 H404 Z" fill="url(#faceR)"/>
    </g>
  </g>
</svg>